spring:
  application:
    name: capgemini-test
  datasource:
    url: jdbc:postgresql://localhost:5555/users
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000


external:
  service:
    url: http://localhost:1080

app:
  users:
    default-room-id: 1

logging:
  level:
    com.capgemini.test.code.clients: DEBUG
